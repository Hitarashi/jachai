[package]
name = "jachai"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Universal declarative schema definition, validation, sanitization, and structured error reporting engine for Rust."
repository = "https://github.com/Hitarashi/jachai"
readme = "README.md"
keywords = ["validator", "schema", "validation", "sanitization", "rfc9457"]
categories = ["development-tools", "web-programming", "data-structures"]

[features]
default = ["full"]
full = [
    "schemas",
    "request",
    "rfc9457",
    "messages",
    "coercion",
    "regex",
    "async",
    "macros",
]

# Umbrella for all schema builders
schemas = [
    "schema-string",
    "schema-number",
    "schema-boolean",
    "schema-array",
    "schema-object",
    "schema-record",
    "schema-tuple",
    "schema-union",
    "schema-enum",
    "schema-date",
    "schema-file",
    "schema-transform",
    "schema-geo",
    "schema-financial",
    "schema-network",
    "schema-identifiers",
    "schema-color",
    "schema-crypto",
    "schema-business",
]

# Primitive schema validators
schema-string = ["regex"]
schema-number = []
schema-boolean = []
schema-array = []
schema-object = []
schema-record = []
schema-tuple = []
schema-union = []
schema-enum = []
schema-date = []
schema-file = []
schema-transform = []
schema-geo = []
schema-financial = []
schema-network = []
schema-identifiers = []
schema-color = []
schema-crypto = []
schema-business = []

# Protocol, transport, error format layers
request = ["schema-object"]
rfc9457 = []
messages = []
coercion = []

# Optional dependencies & runtimes
regex = ["dep:regex"]
async = ["dep:futures-util"]
macros = []

[dependencies]
# External Dependencies
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

# Optional Dependencies
futures-util = { version = "0.3.34", optional = true, default-features = false, features = ["alloc"] }
regex = { version = "1.13.2", optional = true, default-features = false, features = ["std", "perf"] }

[dev-dependencies]
criterion = "0.8.2"
garde = { git = "https://github.com/jprochazk/garde.git", rev = "c67cda4573fee55865811eefc7fb7f22a692336c", features = ["derive", "email", "url", "credit-card"] }
proptest = "1.12.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
validator = { git = "https://github.com/Keats/validator.git", rev = "68f2e33d236f579ae7bf42c82cf2ca7986f176f6", features = ["derive", "card"] }
zod-rs = { git = "https://github.com/maulanasdqn/zod-rs.git", rev = "f8f31572aa395471823eee201ed267ce5c475b1b", features = ["macros"] }

[[bench]]
name = "cross_benchmark"
harness = false
